{% extends 'listings/base.html' %}
<!-- listings/email_sent.html -->
{% if success_message %}
    <div style="background-color: #d4edda; color: #155724; padding: 15px; margin-bottom: 20px; border: 1px solid #c3e6cb; border-radius: 5px;">
        <strong>Success!</strong> {{ success_message }}
        <br><br>
        <a href="{% url 'contact' %}">Send another message</a>
    </div>
{% endif %}

<!-- Your existing form HTML -->
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send</button>
</form>

<h1>Message Sent!</h1>
<p>Thank you for contacting us. We will get back to you soon.</p>
<a href="{% url 'contact' %}">Go back to contact form</a>
